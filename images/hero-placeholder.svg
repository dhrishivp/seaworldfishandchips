<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="t">
  <title id="t">Illustration of fish and chips in a paper cone (placeholder for a real photo)</title>
  <rect width="600" height="480" fill="#13315c"/>
  <circle cx="300" cy="230" r="190" fill="#1b4079"/>
  <!-- chips -->
  <g fill="#ffd166" stroke="#e0a526" stroke-width="3">
    <rect x="215" y="120" width="26" height="150" rx="6" transform="rotate(-14 228 195)"/>
    <rect x="250" y="100" width="26" height="160" rx="6" transform="rotate(-5 263 180)"/>
    <rect x="285" y="95" width="26" height="165" rx="6" transform="rotate(3 298 178)"/>
    <rect x="320" y="105" width="26" height="155" rx="6" transform="rotate(10 333 183)"/>
    <rect x="352" y="125" width="26" height="140" rx="6" transform="rotate(18 365 195)"/>
  </g>
